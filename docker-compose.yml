# ===================================================================
# Spirit Tech Revolution – Infrastructure partagée (Database Smart VPS)
# ===================================================================
# Démarre UNE SEULE FOIS, commune à tous les projets.
#
# Prérequis (une seule fois sur le serveur) :
#   docker network create proxy
#   touch acme.json && chmod 600 acme.json
#
# Services               URL publique
# ─────────────────────  ───────────────────────────────────
# Traefik dashboard    → https://traefik.INFRA_DOMAIN
# Keycloak (IAM)       → https://auth.INFRA_DOMAIN
# pgAdmin              → https://db.INFRA_DOMAIN
# MinIO console        → https://minio.INFRA_DOMAIN
# MinIO API S3         → https://storage.INFRA_DOMAIN
# Dozzle (logs)        → https://logs.INFRA_DOMAIN
#
# Démarrage :
#   cd /opt/infra
#   docker compose --env-file .env up -d
#
# Mise à jour :
#   git pull && docker compose --env-file .env up -d
# ===================================================================

services:

  # ─── Traefik v3 – Reverse proxy + SSL Let's Encrypt ───────────────
  traefik:
    image: traefik:v3.7.18@sha256:9c437ac4f09ce6f4980a8544902d3475fdf70a1a7c578729581d2535dfa7d635
    container_name: traefik
    restart: unless-stopped
    command:
      - --api.dashboard=true
      # API Traefik non exposée : le tableau de bord passe uniquement par
      # https://traefik.INFRA_DOMAIN, protégé par admin-auth (SE03, 18/11/2026)
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=proxy
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/acme.json
      - --certificatesresolvers.letsencrypt.acme.tlschallenge=true
      - --log.level=INFO
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./acme.json:/acme.json
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.traefik-dash.rule=Host(`traefik.${INFRA_DOMAIN}`)
      - traefik.http.routers.traefik-dash.entrypoints=websecure
      - traefik.http.routers.traefik-dash.tls.certresolver=letsencrypt
      - traefik.http.routers.traefik-dash.service=api@internal
      - traefik.http.routers.traefik-dash.middlewares=admin-auth
      - traefik.http.middlewares.admin-auth.basicauth.users=${TRAEFIK_BASIC_AUTH}

  # ─── PostgreSQL 17 – Instance unique, toutes les bases ─────────────
  # Pas de port exposé — accès via infra-internal uniquement
  postgres-shared:
    image: postgres:17-alpine@sha256:979c4379dd698aba0b890599a6104e082035f98ef31d9b9291ec22f2b13059ca
    container_name: postgres-shared
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    networks:
      - infra-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ─── Keycloak 26 – IAM partagé, un realm par projet ────────────────
  # Un realm par projet : dinthialma, pharmagest
  keycloak:
    image: quay.io/keycloak/keycloak:26.1.5@sha256:be6a86215213145bfb4fb3e2b3ab982a806d00262655abdcf3ffa6a38d241c7c
    container_name: keycloak
    restart: unless-stopped
    command: start
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: postgres-shared
      KC_DB_URL_DATABASE: db-keycloak
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HTTP_PORT: 8080
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: https://auth.${INFRA_DOMAIN}
      # Console d'administration servie uniquement sur le VPS (127.0.0.1:8081),
      # joignable par tunnel SSH : ssh -L 8081:127.0.0.1:8081 dinthialma
      # puis http://localhost:8081/admin/ (SE06, 21/11/2026)
      KC_HOSTNAME_ADMIN: http://localhost:8081
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_LOG_LEVEL: info
      JAVA_OPTS_APPEND: "-Xms256m -Xmx512m"
    # Port publié sur la boucle locale du VPS seulement (jamais sur Internet)
    ports:
      - "127.0.0.1:8081:8080"
    networks:
      - proxy
      - infra-internal
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      # Public : uniquement ce dont les utilisateurs et les applis ont besoin
      # (connexion, jetons, clés publiques, ressources des pages de connexion).
      # /admin (console et API) n'est pas exposé (SE06) ; le realm master reste
      # public car la console s'y connecte (protégé par 2FA + anti force brute, SE15/SE16). Les backends appellent
      # l'API d'administration par le réseau interne (http://keycloak:8080).
      - traefik.http.routers.keycloak.rule=Host(`auth.${INFRA_DOMAIN}`) && (PathPrefix(`/realms/`) || PathPrefix(`/resources/`))
      - traefik.http.routers.keycloak.entrypoints=websecure
      - traefik.http.routers.keycloak.tls.certresolver=letsencrypt
      - traefik.http.services.keycloak.loadbalancer.server.port=8080
    depends_on:
      postgres-shared:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000 && printf \"GET /health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3 && timeout 2 cat <&3 | grep -q UP' || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 20
      start_period: 90s

  # ─── pgAdmin 4 – Gestion de toutes les bases ───────────────────────
  pgadmin:
    image: dpage/pgadmin4:9.19.0@sha256:3591b3d02910dcd817dec6fcaa681c278ba6966945283dd0ea0042731c330c83
    container_name: pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "True"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    # Plus d'adresse publique (IN14, 21/11/2026) : port publié sur la boucle locale
    # du VPS seulement, joignable par tunnel SSH :
    #   ssh -L 5050:127.0.0.1:5050 dinthialma   puis   http://localhost:5050
    ports:
      - "127.0.0.1:5050:80"
    networks:
      - infra-internal
    labels:
      - traefik.enable=false
    depends_on:
      postgres-shared:
        condition: service_healthy

  # ─── MinIO – Object storage S3-compatible ──────────────────────────
  # Console  : tunnel SSH vers 127.0.0.1:9001 (plus d'adresse publique)
  # API S3   : https://storage.INFRA_DOMAIN  ← URL que les backends utilisent
  # Interne  : http://minio:9000             ← depuis les conteneurs app
  #
  # ⚠ Image figée : le dépôt minio/minio n'est plus disponible sur Docker Hub
  # (constaté le 19/11/2026). L'image ci-dessous n'existe plus que sur le VPS :
  # ne pas la supprimer (pas de « docker image prune -a »). pull_policy: never
  # empêche toute tentative de téléchargement ; si l'image venait à manquer, le
  # démarrage échoue clairement au lieu de tirer une autre version.
  # À remplacer (autre source d'image ou autre stockage S3) dans une tâche dédiée.
  minio:
    image: minio/minio:latest@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    pull_policy: never
    container_name: minio
    restart: unless-stopped
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_SERVER_URL: https://storage.${INFRA_DOMAIN}
      # Console servie uniquement par tunnel SSH (21/11/2026) :
      #   ssh -L 9001:127.0.0.1:9001 dinthialma   puis   http://localhost:9001
      MINIO_BROWSER_REDIRECT_URL: http://localhost:9001
    volumes:
      - minio_data:/data
    # Console web : plus d'adresse publique, boucle locale du VPS seulement
    ports:
      - "127.0.0.1:9001:9001"
    networks:
      - proxy
      - infra-internal
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      # API S3 publique (protégée par les clés d'accès MinIO)
      - traefik.http.routers.minio-api.rule=Host(`storage.${INFRA_DOMAIN}`)
      - traefik.http.routers.minio-api.entrypoints=websecure
      - traefik.http.routers.minio-api.tls.certresolver=letsencrypt
      - traefik.http.routers.minio-api.service=minio-api-svc
      - traefik.http.services.minio-api-svc.loadbalancer.server.port=9000
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ─── Dozzle – Logs temps réel de tous les conteneurs ───────────────
  dozzle:
    image: amir20/dozzle:v11.4.3@sha256:244f218c876d6ed766277e71a537f34bfb2c01829e1927737e3673a8327deeb8
    container_name: dozzle
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.dozzle.rule=Host(`logs.${INFRA_DOMAIN}`)
      - traefik.http.routers.dozzle.entrypoints=websecure
      - traefik.http.routers.dozzle.tls.certresolver=letsencrypt
      - traefik.http.routers.dozzle.middlewares=admin-auth
      - traefik.http.services.dozzle.loadbalancer.server.port=8080
    environment:
      DOZZLE_LEVEL: info

volumes:
  postgres_data:
    name: infra-postgres-data
  pgadmin_data:
    name: infra-pgadmin-data
  minio_data:
    name: infra-minio-data

networks:
  proxy:
    external: true
  infra-internal:
    name: infra-internal
    driver: bridge
